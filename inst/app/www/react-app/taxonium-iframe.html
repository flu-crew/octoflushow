    const patristic = window.patristic;

    /**
    function pruneTree(branch, allowedLeafIds) {
      // If it's a leaf, check if it's in the allowed list
      if (branch.isLeaf()) {
        return allowedLeafIds.includes(branch.id);
      }
      // Recursively process children
      if (branch.children) {
        branch.children = branch.children.filter(child => pruneTree(child, allowedLeafIds));
      }
      // Keep this internal branch only if it still has remaining children
      return branch.children && branch.children.length > 0;
    }
    **/

    const strain_list = parent.insert_text.data;
    let patristic_tree = patristic.parseNewick(subsampleTree(original_nwk, strain_list));

    const { createElement } = React;


    function App() {

      // Metadata is optional
      const metadata = {
        data: metadata_text,
        status: "loaded",
        filename: "temp.tsv",
        filetype: "meta_tsv",
      };

      const sourceData = {
        data: nwk, //nex,
        status: "loaded",
        filename: "temp.nwk", //"temp.nex",
        filetype: "nwk", //"nexus",
        metadata: metadata,
      };
      
      return createElement(Taxonium, { sourceData: sourceData });

    const container = document.getElementById('taxonium_root');
    const root = createRoot(container);
    root.render(createElement(App));
