<body>
<html>
  <div id="taxonium_root" style = "width:100%; height: calc(100vh - 90px); border:none;"></div>

  <script type="module">

    alert('Total rows: ' + parent.insert_text.data); //test
    console.log('Received dataframe from R:', parent.insert_text.data); // test

    import React from 'https://esm.sh/react@19';
    import { createRoot } from 'https://esm.sh/react-dom@19/client';
    import Taxonium from 'https://esm.sh/taxonium-component';
    
    // tree data
    const metadata_text = await fetch('./tree/test.tsv').then(r => r.text());  //console.log(metadata_text);
    const nwk = await fetch('./tree/test.fna.tre').then(r => r.text());        //console.log(nwk);

    const { createElement } = React;


    function App() {

      // Metadata is optional
      const metadata = {
        data: metadata_text,
        status: "loaded",
        filename: "temp.tsv",
        filetype: "meta_tsv",
      };

      const sourceData = {
        data: nwk,
        status: "loaded",
        filename: "temp.nwk",
        filetype: "nwk",
        metadata: metadata,
      };
      
      return createElement(Taxonium, { sourceData: sourceData });
    }

    const container = document.getElementById('taxonium_root');
    const root = createRoot(container);
    root.render(createElement(App));
  </script>
</body>
</html>
